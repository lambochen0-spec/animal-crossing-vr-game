name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 删了 lockfile (避免失效镜像 URL)
      # --legacy-peer-deps 跳过 peerDeps 检查 (项目本来就这样)
      - name: Install (force official registry, legacy peer deps)
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm install --legacy-peer-deps

      - run: npx vite build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
