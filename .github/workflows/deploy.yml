name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # lockfile 里有 126 个包从失效的 npm.mirrors.msh.team 拉
      # 用环境变量强制所有 npm 请求走官方 registry, 不用 --registry (避开 / 转义)
      - name: Install deps (force official npm registry)
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm install

      - run: npx vite build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
