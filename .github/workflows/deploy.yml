name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Node 20 已 deprecation, runner 强制 Node 24.
      # 升 Node 22 拿到 npm 10.9+ (含 lockfile v3 'Exit handler never called' bug 修复)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm ci: 用 lockfile, 不重新解析, 避 DNS EAI_AGAIN
      # --include=dev: 装 vite 等 devDependencies
      - run: npm ci --include=dev

      - run: npx vite build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
