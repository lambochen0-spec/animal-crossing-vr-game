name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reasonix 报告的 A 方案备用版
      # npm install (而非 npm ci 因为 ci 在这个 lockfile 上触发 npm 10 'Exit handler never called' bug)
      # --include=dev 装 vite 等 devDependencies
      # --ignore-scripts 跳过 lifecycle scripts (这些是 SIGABRT 触发点)
      # --foreground-scripts 不是要 ignore 的, 单写
      - run: npm install --include=dev --ignore-scripts

      - run: npx vite build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
